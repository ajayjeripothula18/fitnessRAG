<style>
    .glass-panel {
        background: rgba(19, 27, 46, 0.4);
        backdrop-filter: blur(20px);
        border: 1px solid transparent;
        background-clip: padding-box;
    }
    
    .glass-border {
        position: relative;
    }
    
    .glass-border::before {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.05) 100%);
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
    }

    .neon-border-top {
        border-top: 2px solid #2ff801; /* secondary-container / Neon Green */
    }
</style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-container-margin md:p-section-gap font-body-md overflow-hidden relative selection:bg-primary-container selection:text-white">
<!-- Ambient glow behind the card -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-30">
<div class="w-[300px] h-[300px] bg-primary-container rounded-full blur-[100px]"></div>
</div>
<!-- Main Content Container -->
<main class="w-full max-w-md relative z-10 flex flex-col items-center">
<!-- Branding Logo -->
<div class="mb-section-gap flex flex-col items-center">
<img alt="FitnessRAG Logo" class="w-32 h-32 object-cover rounded-xl shadow-[0_10px_30px_-10px_rgba(138,43,226,0.5)] mb-unit" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA4Pq-XD9BRYu-uGnIc_Pu7-o__-gq5tWCti2IBgyHrwwdmjXKJN_-eFhgKfhXTDzH-78DgPSQwJFyTUokcc29MzmmeTvBnRsKieDfPfzBSD2U2M65hCrWYi-zkkMUSOF8aYIizPPJkneXN4ATlP8CJbVtHLVSxrIS-dTqHCSq6acDPGK-4WSHIKCaDGchRbYkFuTO-aJqJGHEocA3P92-kIvvkEnh-IluogKVF-QTiPVz2Iue9IB3X"/>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary-fixed tracking-tight">FitnessRAG</h1>
</div>
<!-- Glassmorphism Login Card -->
<div class="w-full glass-panel glass-border rounded-xl p-card-padding neon-border-top shadow-2xl relative overflow-hidden group">
<div class="mb-gutter text-center">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-2">Welcome Back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Access your AI-powered performance data.</p>
</div>
<form action="#" class="flex flex-col gap-gutter" method="POST">
<!-- Email Input -->
<div class="relative">
<label class="sr-only" for="email">Email address</label>
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input autocomplete="email" class="appearance-none block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-md leading-5 bg-surface-container-low/50 text-on-surface placeholder-on-surface-variant/50 focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors sm:text-sm" id="email" name="email" placeholder="Email address" required="" type="email"/>
</div>
<!-- Password Input -->
<div class="relative">
<label class="sr-only" for="password">Password</label>
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input autocomplete="current-password" class="appearance-none block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-md leading-5 bg-surface-container-low/50 text-on-surface placeholder-on-surface-variant/50 focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors sm:text-sm" id="password" name="password" placeholder="Password" required="" type="password"/>
</div>
<div class="flex items-center justify-between mt-2">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant bg-surface-container-lowest rounded" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block text-sm text-on-surface-variant" for="remember-me">Remember me</label>
</div>
<div class="text-sm">
<a class="font-medium text-primary hover:text-primary-fixed transition-colors" href="#">Forgot password?</a>
</div>
</div>
<!-- Sign In Button -->
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-label-caps text-label-caps text-on-primary-container bg-primary-container hover:bg-on-primary-fixed-variant focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary focus:ring-offset-surface-dim transition-all active:scale-[0.98]" type="submit">
                    Sign In
                </button>
</form>
</div>
<!-- Sign Up Link -->
<p class="mt-gutter text-center text-sm text-on-surface-variant">
            Don't have an account? 
            <a class="font-medium text-primary hover:text-primary-fixed transition-colors" href="#">Sign up</a>
</p>
</main>
<!-- Navigation Suppressed as per Shared Components Logic (Linear/Transactional screen) -->
</body></html>
